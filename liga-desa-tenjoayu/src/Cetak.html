
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<base target="_top">
<title>Cetak - Liga Desa Tenjoayu</title>

<style>
:root {
  --bg:#061426;
  --panel:#0d2036;
  --panel2:#102a43;
  --line:#1d405e;
  --text:#edf5ff;
  --muted:#9bb0c6;
  --green:#22c55e;
  --green2:#16a34a;
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family:system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

/* TOOLBAR */

.bar {
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(7,22,39,.96);
  border-bottom:1px solid var(--line);
  padding:14px 20px;
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  backdrop-filter:blur(12px);
}

.bar b {
  font-size:17px;
  margin-right:auto;
}

.bar label {
  font-size:13px;
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  cursor:pointer;
}

.bar input {
  accent-color:var(--green);
  width:17px;
  height:17px;
}

button {
  background:linear-gradient(135deg,var(--green),var(--green2));
  color:#052e16;
  border:0;
  border-radius:10px;
  padding:11px 20px;
  font-weight:800;
  font-size:14px;
  cursor:pointer;
  transition:.2s;
}

button:active { transform:scale(.96); }

/* ERROR */

#err {
  color:#fca5a5;
  text-align:center;
  padding:15px;
}

/* KERTAS */

.kertas {
  max-width:900px;
  margin:24px auto;
  padding:30px;
  background:linear-gradient(145deg,#0d2036,#091a2d);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 12px 35px rgba(0,0,0,.25);
}

h1 {
  margin:0;
  font-size:26px;
  text-align:center;
  font-weight:850;
  letter-spacing:-.5px;
}

.sub {
  text-align:center;
  color:var(--muted);
  margin:7px 0 25px;
  font-size:13px;
  padding-bottom:16px;
  border-bottom:2px solid var(--green);
}

h2 {
  font-size:16px;
  margin:25px 0 12px;
  color:#4ade80;
  display:flex;
  align-items:center;
  gap:9px;
}

h2::before {
  content:"";
  display:inline-block;
  width:4px;
  height:19px;
  background:var(--green);
  border-radius:5px;
}

/* TABLE */

.table-wrap {
  width:100%;
  margin-bottom:15px;
}

table {
  width:100%;
  border-collapse:collapse;
  font-size:13px;
  margin-bottom:8px;
  overflow:hidden;
  border-radius:10px;
}

th,td {
  border:1px solid var(--line);
  padding:10px 8px;
  text-align:center;
}

th {
  background:#163653;
  color:#d9fbe5;
  font-weight:750;
}

td {
  background:#0b1d31;
  color:var(--text);
}

td.k { text-align:left; }
td.r { text-align:right; }
.skor { min-width:75px; font-weight:800; }

tbody tr:nth-child(even) td {
  background:#102740;
}

.ttd {
  margin-top:45px;
  text-align:right;
  font-size:13px;
  color:var(--muted);
}

.ttd div {
  margin-top:65px;
}

.empty {
  background:#102740;
  border:1px dashed var(--line);
  padding:20px;
  border-radius:12px;
  text-align:center;
  color:var(--muted);
}

/* MOBILE */

@media(max-width:650px) {

  .bar {
    padding:12px;
    gap:12px;
  }

  .bar b {
    width:100%;
    font-size:16px;
    margin-bottom:3px;
  }

  .bar label {
    font-size:11px;
    flex:1;
    min-width:90px;
  }

  .bar button {
    width:100%;
    padding:13px;
  }

  .kertas {
    width:calc(100% - 20px);
    margin:12px auto;
    padding:17px 13px;
    border-radius:14px;
  }

  h1 { font-size:21px; }

  .sub {
    font-size:11px;
    margin-bottom:20px;
  }

  h2 {
    font-size:14px;
    margin-top:22px;
  }

  /* TABEL BERUBAH MENJADI KARTU */

  table, tbody {
    display:block;
    width:100%;
  }

  thead { display:none; }

  tr {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0;
    margin-bottom:12px;
    background:#102740;
    border:1px solid var(--line);
    border-radius:11px;
    overflow:hidden;
  }

  th { display:none; }

  td {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    min-width:0;
    padding:9px 8px;
    font-size:11px;
    text-align:right !important;
    border:1px solid rgba(29,64,94,.55);
    overflow-wrap:anywhere;
  }

  td::before {
    content:attr(data-label);
    color:var(--muted);
    font-size:10px;
    font-weight:650;
    text-align:left;
    flex-shrink:0;
  }

  td.k,td.r { text-align:right; }

  .skor { min-width:0; }

  .ttd { font-size:11px; }
}

/* CETAK A4 */

@page {
  size:A4;
  margin:15mm;
}

@media print {

  body {
    background:#fff !important;
    color:#111 !important;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }

  .bar,#err { display:none !important; }

  .kertas {
    background:#fff !important;
    color:#111 !important;
    box-shadow:none;
    border:0;
    border-radius:0;
    margin:0;
    padding:0;
    max-width:none;
    width:100%;
  }

  h1 { color:#111; }

  .sub {
    color:#555;
    border-bottom:2px solid #15803d;
  }

  h2 {
    color:#15803d;
    break-after:avoid;
  }

  table {
    display:table !important;
    width:100%;
    border-collapse:collapse;
    font-size:10px;
    border-radius:0;
  }

  tbody {
    display:table-row-group !important;
  }

  tr {
    display:table-row !important;
    break-inside:avoid;
    border:0;
  }

  th,td {
    display:table-cell !important;
    color:#111 !important;
    background:#fff !important;
    border:1px solid #aaa;
    padding:6px 5px;
    font-size:10px;
  }

  th {
    background:#e8f5ec !important;
    color:#14532d !important;
  }

  td::before { display:none !important; }

  .ttd { color:#111; }

  .table-wrap {
    break-inside:auto;
  }
}
</style>
</head>

<body>

<div class="bar">
  <b>📄 Cetak Jadwal Liga</b>

  <label>
    <input type="checkbox" id="oJadwal" checked onchange="tampil()">
    Jadwal
  </label>

  <label>
    <input type="checkbox" id="oKlas" checked onchange="tampil()">
    Klasemen
  </label>

  <label>
    <input type="checkbox" id="oSkor" checked onchange="tampil()">
    Kolom skor kosong
  </label>

  <button onclick="window.print()">Cetak / Simpan PDF</button>
</div>

<div id="err"></div>

<div class="kertas" id="kertas">
  <div class="empty">Memuat data...</div>
</div>

<script>
let D = null;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])
);

const K = id =>
  (D.klub.find(k => k.id === id) || {nama:'?'}).nama;

const cek = id =>
  document.getElementById(id).checked;

function tgl(s) {
  const p = String(s).slice(0,10).split('-');

  return new Date(
    +p[0],+p[1]-1,+p[2]
  ).toLocaleDateString('id-ID',{
    weekday:'long',
    day:'numeric',
    month:'long',
    year:'numeric'
  });
}

function baris(m) {
  const sel = m.status === 'Selesai';

  const skor = sel
    ? m.skorHome + ' - ' + m.skorAway
    : (cek('oSkor') ? '&nbsp;' : 'vs');

  return `<tr>
    <td data-label="Tanggal">${esc(tgl(m.tanggal))}</td>
    <td data-label="Jam">${esc(String(m.tanggal).slice(11,16) || '15:00')}</td>
    <td data-label="Tuan rumah" class="r">${esc(K(m.home))}</td>
    <td data-label="Skor" class="skor">${skor}</td>
    <td data-label="Tamu" class="k">${esc(K(m.away))}</td>
  </tr>`;
}

function tabelJadwal() {
  if (!D.match.length)
    return '<div class="empty">Belum ada jadwal pertandingan.</div>';

  const grup = {};

  D.match.forEach(m => {
    const n = m.fase === 'Grup'
      ? 'Grup ' + m.grup + ' - Ronde ' + m.ronde
      : m.fase === 'Liga'
        ? 'Ronde ' + m.ronde
        : m.fase;

    (grup[n] = grup[n] || []).push(m);
  });

  return Object.keys(grup).map(n => `
    <h2>${esc(n)}</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Tanggal</th>
            <th>Jam</th>
            <th>Tuan rumah</th>
            <th>Skor</th>
            <th>Tamu</th>
          </tr>
        </thead>
        <tbody>
          ${grup[n].map(baris).join('')}
        </tbody>
      </table>
    </div>
  `).join('');
}

function tabelKlasemen() {
  return Object.keys(D.klasemen).sort().map(g => `
    <h2>Klasemen ${D.mode === 'liga' ? 'Liga' : 'Grup ' + esc(g)}</h2>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Klub</th>
            <th>M</th>
            <th>Mn</th>
            <th>S</th>
            <th>K</th>
            <th>GM</th>
            <th>GK</th>
            <th>SG</th>
            <th>Poin</th>
          </tr>
        </thead>

        <tbody>
          ${D.klasemen[g].map((r,i) => `
            <tr>
              <td data-label="Posisi">${i+1}</td>
              <td data-label="Klub" class="k">${esc(r.nama)}</td>
              <td data-label="Main">${r.m}</td>
              <td data-label="Menang">${r.mn}</td>
              <td data-label="Seri">${r.s}</td>
              <td data-label="Kalah">${r.k}</td>
              <td data-label="Gol Masuk">${r.gm}</td>
              <td data-label="Gol Kemasukan">${r.gk}</td>
              <td data-label="Selisih Gol">${r.sg}</td>
              <td data-label="Poin"><b>${r.pts}</b></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `).join('');
}

function tampil() {
  if (!D) return;

  document.getElementById('kertas').innerHTML = `
    <h1>Liga Desa Tenjoayu</h1>

    <div class="sub">
      Jadwal dan klasemen · Dicetak
      ${new Date().toLocaleDateString('id-ID',{
        day:'numeric',
        month:'long',
        year:'numeric'
      })}
    </div>

    ${cek('oJadwal') ? tabelJadwal() : ''}
    ${cek('oKlas') ? tabelKlasemen() : ''}

    ${!cek('oJadwal') && !cek('oKlas')
      ? '<div class="empty">Pilih jadwal atau klasemen untuk ditampilkan.</div>'
      : ''}

    <div class="ttd">
      Panitia Liga Desa Tenjoayu
      <div>(................................)</div>
    </div>
  `;
}

google.script.run
  .withSuccessHandler(d => {
    D = d;
    tampil();
  })
  .withFailureHandler(e => {
    document.getElementById('err').textContent =
      'Gagal memuat: ' + (e.message || e);
  })
  .getData(true);
</script>

</body>
</html>
