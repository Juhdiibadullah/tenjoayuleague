<script>
/* Pastikan WebView Android memakai lebar layar perangkat, bukan layout desktop. */
(function(){
  try {
    var vp = document.querySelector('meta[name="viewport"]');
    var w = (window.screen && window.screen.width) ? window.screen.width : 0;
    if (vp && w > 0 && w < 900) vp.setAttribute('content', 'width=' + w + ', initial-scale=1, viewport-fit=cover');
  } catch(e) {}
})();
</script>

/* Intro screen saat website pertama dibuka */
#bootScreen {
  position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at 50% 40%,#103c63 0%,#06182c 48%,#030b15 100%);
  opacity:1; visibility:visible; transition:opacity .55s ease, visibility .55s ease;
}
#bootScreen.done { opacity:0; visibility:hidden; pointer-events:none; }
.boot-inner { text-align:center; padding:28px; animation:bootRise .75s cubic-bezier(.2,.8,.2,1) both; }
.boot-mark { width:82px; height:82px; margin:0 auto 18px; border:1px solid rgba(89,194,255,.55); border-radius:26px; display:grid; place-items:center; font-size:48px; color:#dff5ff; background:linear-gradient(145deg,rgba(21,151,246,.25),rgba(4,23,43,.9)); box-shadow:0 0 38px rgba(21,151,246,.24),inset 0 1px rgba(255,255,255,.2); animation:bootPulse 1.8s ease-in-out infinite; }
.boot-title { font-weight:850; letter-spacing:1.4px; font-size:20px; }
.boot-sub { color:#9bbbd7; font-size:12px; margin-top:5px; letter-spacing:2px; }
.boot-track { width:190px; height:3px; margin:22px auto 0; background:rgba(130,190,230,.17); border-radius:9px; overflow:hidden; }
.boot-track:after { content:""; display:block; height:100%; width:42%; border-radius:9px; background:linear-gradient(90deg,#0874c9,#65d4ff); animation:bootLoad 1.25s ease-in-out infinite; }
@keyframes bootRise { from {opacity:0;transform:translateY(18px) scale(.96)} to {opacity:1;transform:none} }
@keyframes bootPulse { 50% { transform:translateY(-5px); box-shadow:0 0 48px rgba(21,151,246,.4),inset 0 1px rgba(255,255,255,.2) } }
@keyframes bootLoad { from {transform:translateX(-110%)} to {transform:translateX(260%)} }

.pg { animation:pageReveal .42s cubic-bezier(.18,.75,.25,1) both; }

.card, .stat, .ts, .info { animation:softReveal .42s ease both; }
@keyframes softReveal { from {opacity:0;transform:translateY(8px)} to {opacity:1;transform:translateY(0)} }
button, .lnk, a { -webkit-tap-highlight-color:transparent; }
button { transition:transform .18s cubic-bezier(.2,.8,.2,1),filter .2s,box-shadow .2s; }
button:hover { filter:brightness(1.12); }
button:active { transform:scale(.96); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid #56c5ff; outline-offset:2px; }

@keyframes miniSpin { to {transform:rotate(360deg)} }

}

.app { background:linear-gradient(135deg,rgba(3,15,31,.98),rgba(2,9,20,.98)); }
.wrap:before { background:radial-gradient(ellipse at 50% 0%,rgba(13,119,211,.18),transparent 36%),radial-gradient(ellipse at 50% 100%,rgba(0,105,190,.12),transparent 48%),linear-gradient(180deg,rgba(3,17,34,.08),rgba(1,9,20,.28)); }
.wrap:after { content:"";position:fixed;z-index:-1;pointer-events:none;inset:66px 0 0 230px;opacity:.34;background:radial-gradient(ellipse at 50% 9%,rgba(54,174,255,.36),transparent 2%,transparent 25%),repeating-linear-gradient(90deg,transparent 0 7%,rgba(96,190,255,.09) 7.1% 7.2%,transparent 7.3% 14%),linear-gradient(180deg,transparent 0 55%,rgba(10,90,150,.08) 56%,transparent 57%),radial-gradient(ellipse at 50% 100%,rgba(0,120,210,.18),transparent 45%);mask-image:linear-gradient(to bottom,#000,transparent 78%);}
.app.sidebar-collapsed .wrap:after { left:78px; }
nav button.on { background:linear-gradient(110deg,#0878d5,#12b5ff);box-shadow:0 5px 22px rgba(0,145,255,.25); }
.link,button.btn { background:linear-gradient(110deg,#0878d5,#16b7ff);color:#fff; }
.next { background:linear-gradient(130deg,#061d37,#07518b); }
.jam { background:#086fc0;color:#fff; }
tr.first td { background:rgba(0,116,207,.24); }
.pts,.menang,.slogan b,.hero h1 span { color:#38baff; }
.pno { background:#087fd5;color:#fff; }
@media(max-width:720px){.wrap:after{inset:58px 0 62px 0}.app.sidebar-collapsed .wrap:after{left:0}}


.nav-ico{width:22px;height:22px;display:inline-grid;place-items:center;flex:none;color:#b8dfff}.nav-ico svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.nav button.on .nav-ico{color:#fff}.hero{background:linear-gradient(105deg,rgba(2,12,27,.97) 25%,rgba(0,69,130,.86) 100%),radial-gradient(ellipse at 80% 15%,rgba(25,157,255,.32),transparent 50%);border-color:#1769a7}.hero h1 span{color:#27baff}

/* ===== Penyelarasan ikon seluruh halaman + kartu pemain ringkas ===== */
.ui-icon{display:inline-flex;width:1.18em;height:1.18em;align-items:center;justify-content:center;vertical-align:-.19em;color:#43baff;flex:none;margin-right:.22em}
.ui-icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-ico svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-ico{color:#8fd5ff}
nav button.on .nav-ico{color:#fff}
.stat .ic .ui-icon{width:30px;height:30px;margin:0;color:#39baff}
.ch .ui-icon,.card h2 .ui-icon,.card h3 .ui-icon{color:#55c2ff}
button .ui-icon{margin-right:5px}
/* Kartu pemain dibuat lebih kecil dan rapat, tanpa mengubah data/fungsi pemain. */
.pgrid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.pcard{border-radius:10px;min-width:0;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.pcard:hover{transform:translateY(-3px);border-color:#269fe8;box-shadow:0 8px 22px rgba(0,137,220,.13)}
.pfoto{aspect-ratio:4/4.6;max-height:148px;font-size:30px}
.pinfo{padding:7px 8px;line-height:1.3}
.pinfo b{font-size:12px;display:inline-block;overflow-wrap:anywhere}
.pinfo .mut{font-size:11px;margin-top:3px}
.pno{font-size:10px;padding:1px 5px;margin-right:4px}
@media(max-width:720px){
 .pgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
 .pfoto{max-height:120px;aspect-ratio:4/4.8}
 .pinfo{padding:6px}
 .pinfo b{font-size:11px}
 .pinfo .mut{font-size:10px}
}
@media(max-width:380px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}

function notificationItems(){
  if(!D||!Array.isArray(D.match))return [];

  const upcoming=ms.filter(m=>m.status!=='Selesai').slice(0,3).map(m=>({title:'Pertandingan mendatang',desc:K(m.home).nama+' vs '+K(m.away).nama,date:String(m.tanggal).slice(0,16).replace('T',' '),tab:'jadwal'}));
  const latest=ms.filter(m=>m.status==='Selesai').reverse().slice(0,2).map(m=>({title:'Hasil pertandingan tersedia',desc:K(m.home).nama+' '+m.skorHome+' - '+m.skorAway+' '+K(m.away).nama,date:String(m.tanggal).slice(0,10),tab:'hasil'}));
  return upcoming.concat(latest).slice(0,5);
}

function render() {

  document.getElementById('thn').textContent = new Date().getFullYear();

// ---------- Dashboard ----------
function urut(a) { return a.slice().sort((x, y) => String(x.tanggal).localeCompare(String(y.tanggal))); }
function beranda() {
  const selesai = urut(D.match.filter(m => m.status === 'Selesai')).reverse();
  const nx = urut(D.match.filter(m => m.status !== 'Selesai'))[0];
  const semua = [].concat(...Object.values(D.klasemen)).sort((a, b) => b.pts - a.pts || b.sg - a.sg || b.gm - a.gm).slice(0, 5);
  const ts = (D.topSkor || []).slice(0, 3);
  const stat = (ic, n, l) => `<div class="card stat"><span class="ic">${ic}</span><div><b>${n}</b><span class="mut">${l}</span></div></div>`;

      <div>${logo(h)}<div><b>${esc(h.nama)}</b></div></div>
      <div><div class="vs">VS</div><div class="jam">&#128339; ${esc(String(nx.tanggal).slice(11,16) || '15:00')} WIB</div><div class="mut">${tglID(nx.tanggal)}</div><div class="mut">&#128205; ${esc(h.stadion || 'Lapangan')}</div></div>
      <div>${logo(a)}<div><b>${esc(a.nama)}</b></div></div></div>`; })() : `<div class="next mut" style="display:block">Belum ada pertandingan terjadwal.</div>`;
  return `<div class="hero"><small>Selamat Datang di</small><h1>Liga Desa <span>Tenjoayu</span></h1><i>Satu Lapangan, Satu Semangat, Menuju Juara!</i><div class="ball">&#9917;</div></div>
  <div class="stats">${stat('&#127942;', D.klub.length, 'Klub Peserta')}${stat('&#128101;', D.pemain.length, 'Pemain')}${stat('&#128197;', D.match.length, 'Pertandingan')}${stat('&#129359;', 1, 'Lapangan')}</div>
  <div class="two">
    <div class="card flat"><div class="ch"><span>&#127942; Pertandingan Berikutnya</span><button class="link" onclick="pindah('jadwal')">Lihat Jadwal</button></div>${next}</div>
    <div class="card flat"><div class="ch"><span>&#128202; Klasemen Sementara</span><button class="link" onclick="pindah('klasemen')">Lihat Lengkap</button></div>
      <table><tr><th>Pos</th><th>Klub</th><th>Main</th><th>SG</th><th>Poin</th></tr>${semua.map((r, i) => `<tr class="${i === 0 ? 'first' : ''}"><td>${i+1}</td><td><div class="tim">${logo(K(r.id),1)}${esc(r.nama)}</div></td><td>${r.m}</td><td>${r.sg > 0 ? '+' : ''}${r.sg}</td><td class="pts">${r.pts}</td></tr>`).join('')}</table></div>
  </div>
  <div class="two">
    <div class="card flat"><div class="ch"><span>&#9917; Top Score</span><button class="link" onclick="pindah('topskor')">Lihat Lengkap</button></div>
      ${ts.length ? ts.map((p, i) => `<div class="ts"><b>${i+1}</b><div>${ava(p)} <b>${esc(p.nama)}</b> <span class="mut">(${esc(K(p.klubId).nama)})</span></div><b>${p.gol} Gol</b></div>`).join('') : '<div class="info mut">Belum ada gol tercatat.</div>'}</div>
    <div class="card flat"><div class="ch"><span>&#128226; Informasi Terbaru</span><button class="link" onclick="pindah('hasil')">Lihat Semua</button></div>
      ${selesai.slice(0, 3).map(m => `<div class="info"><span class="dot"></span>${esc(K(m.home).nama)} ${m.skorHome} - ${m.skorAway} ${esc(K(m.away).nama)}<em>${tglID(m.tanggal, 1)}</em></div>`).join('') || '<div class="info mut">Belum ada hasil pertandingan.</div>'}</div>
  </div>`;

// ---------- Klub & pemain ----------
function klubTab() {
  if (klubAktif) return detailKlub(K(klubAktif));
  return `<div class="grid">` + D.klub.map(k => `
    <div class="card klub" onclick="klubAktif='${k.id}';render()">
      ${logo(k)}<h3 style="margin:10px 0 2px">${esc(k.nama)}</h3>
      <div class="mut">${esc(k.kota)}${D.mode === 'liga' ? '' : ' &middot; Grup ' + esc(k.grup)}</div>
    </div>`).join('') + `</div>`;
}

const GRUP_POS = [['GK','Kiper'],['DF','Bek'],['MF','Gelandang'],['FW','Penyerang']];
function foto(p, k) {
  if (p.foto) return `<img class="pfoto" src="${esc(p.foto)}" alt="">`;
  return `<div class="pfoto" style="background:${esc(k.warna || '#475569')}">${esc(p.nomor)}</div>`;
}
function ava(p) { return p.foto ? `<img class="ava" src="${esc(p.foto)}" alt="">` : ''; }
const kartuP = (x, k) => `<div class="card pcard">${foto(x, k)}<div class="pinfo"><span class="pno">${esc(x.nomor)}</span><b>${esc(x.nama)}</b>
  <div class="mut">${esc(x.posisi)}${x.gol > 0 ? ' &middot; &#9917; ' + x.gol : ''}</div></div></div>`;

function pemainTab() {
  return D.klub.map(k => {
    const p = D.pemain.filter(x => x.klubId === k.id).sort((a, b) => a.nomor - b.nomor);
    return `<h2>${esc(k.nama)}</h2><div class="pgrid">${p.map(x => kartuP(x, k)).join('')}</div>`;
  }).join('');
}

function detailKlub(k) {
  const p = D.pemain.filter(x => x.klubId === k.id).sort((a, b) => a.nomor - b.nomor);
  return `<button class="btn sm" onclick="klubAktif=null;render()">&larr; Semua klub</button>
  <div class="card" style="margin-top:12px;display:flex;gap:20px;align-items:center;flex-wrap:wrap">
    ${logo(k)}
    <div><h2 style="margin:0">${esc(k.nama)}</h2>
      <div class="mut">Kota: ${esc(k.kota)} &middot; Berdiri: ${esc(k.berdiri)} &middot; Stadion: ${esc(k.stadion)}${D.mode === 'liga' ? '' : ' &middot; Grup ' + esc(k.grup)}</div></div>
  </div>` + GRUP_POS.map(([c, nama]) => {
    const g = p.filter(x => x.posisi === c);
    return g.length ? `<h2>${nama}</h2><div class="pgrid">${g.map(x => kartuP(x, k)).join('')}</div>` : '';
  }).join('') + jadwalKlub(k);
}

function jadwalKlub(k) {
  const ms = urut(D.match.filter(m => m.home === k.id || m.away === k.id));
  if (!ms.length) return `<h2>Jadwal &amp; hasil</h2><p class="mut">Belum ada jadwal.</p>`;
  return `<h2>Jadwal &amp; hasil</h2><div class="card">` + ms.map(m =>
    `<div class="mut" style="padding-top:8px">${esc(m.fase)}${m.fase !== 'Semifinal' && m.fase !== 'Final' ? ' &middot; Ronde ' + m.ronde : ''}</div>` + barisMatch(m)
  ).join('') + `</div>`;
}

// ---------- Klasemen ----------
function klasemen() {
  const liga = D.mode === 'liga';
  return Object.keys(D.klasemen).sort().map(g => `
    <h2>${liga ? 'Klasemen Liga' : 'Grup ' + esc(g)}</h2>
    <div class="card"><table>
      <tr><th>#</th><th>Klub</th><th>M</th><th>Mn</th><th>S</th><th>K</th><th>GM</th><th>GK</th><th>SG</th><th>Poin</th></tr>
      ${D.klasemen[g].map((r,i) => `<tr class="${i<2 && !liga ? 'top2' : ''}"><td>${i+1}</td><td><div class="tim">${logo(K(r.id),1)}${esc(r.nama)}</div></td>
        <td>${r.m}</td><td>${r.mn}</td><td>${r.s}</td><td>${r.k}</td><td>${r.gm}</td><td>${r.gk}</td><td>${r.sg}</td><td class="pts">${r.pts}</td></tr>`).join('')}
    </table></div>`).join('') + (liga ? '' : `<p class="mut">Garis hijau = lolos semifinal (2 teratas tiap grup).</p>`);
}

// ---------- Jadwal & hasil ----------
function barisMatch(m, edit) {
  const selesai = m.status === 'Selesai';
  const tengah = edit
    ? `<input type="number" min="0" id="h_${m.id}" value="${selesai?m.skorHome:''}"> - <input type="number" min="0" id="a_${m.id}" value="${selesai?m.skorAway:''}">
       <button class="btn sm" onclick="simpan('${m.id}')">Simpan</button>`
    : (selesai ? `${m.skorHome} - ${m.skorAway}` : 'vs');
  const atur = edit && (m.fase === 'Semifinal' || m.fase === 'Final')
    ? `<div class="mut" style="padding:4px 0 8px">Atur tanggal: <input type="date" id="t_${m.id}" value="${esc(String(m.tanggal).slice(0, 10))}"> <input type="time" id="j_${m.id}" value="${esc(String(m.tanggal).slice(11, 16) || '15:00')}"> <button class="btn sm" onclick="simpanTgl('${m.id}')">Simpan tanggal</button></div>` : '';
  return `<div class="mut" style="padding-top:8px">&#128197; ${esc(m.tanggal)}</div><div class="match" style="padding-top:2px">${tim(m.home,true)}<div class="skor">${tengah}</div>${tim(m.away)}</div>` + atur;
}

function jadwal(edit) {
  if (!D.match.length) return `<p class="mut">Belum ada jadwal. Buka tab Kelola lalu klik "Buat jadwal otomatis".</p>`;
  const tmb = `<button class="btn sm" style="margin-top:12px" onclick="urutTgl=!urutTgl;render()">${urutTgl ? 'Tampilan per ronde' : 'Urut per tanggal'}</button>`;
  if (urutTgl) return tmb + `<h2>Semua pertandingan (urut tanggal)</h2><div class="card">` + urut(D.match).map(m =>
    `<div class="mut" style="padding-top:8px">${esc(m.fase)}${m.grup ? ' &middot; Grup ' + esc(m.grup) : ''}${m.fase === 'Grup' || m.fase === 'Liga' ? ' &middot; Ronde ' + m.ronde : ''}</div>` + barisMatch(m, edit)).join('') + `</div>`;
  let out = tmb;
  ['Grup','Liga','Semifinal','Final'].forEach(fase => {
    const ms = D.match.filter(m => m.fase === fase);
    if (!ms.length) return;
    if (fase === 'Grup' || fase === 'Liga') {
      [...new Set(ms.map(m => m.grup))].sort().forEach(g => {
        const mg = ms.filter(m => m.grup === g);
        [...new Set(mg.map(m => m.ronde))].forEach(r => {
          out += `<h2>${fase === 'Grup' ? 'Grup ' + esc(g) + ' &middot; ' : ''}Ronde ${r}</h2><div class="card">${mg.filter(m => m.ronde === r).map(m => barisMatch(m, edit)).join('')}</div>`;
        });
      });
    } else {
      out += `<h2>${fase}</h2><div class="card">${ms.map(m => barisMatch(m, edit)).join('')}</div>`;
    }
  });
  return out;
}

function hasil() {
  const ms = urut(D.match.filter(m => m.status === 'Selesai')).reverse();
  if (!ms.length) return `<p class="mut">Belum ada pertandingan yang selesai.</p>`;
  return `<h2>Hasil Pertandingan</h2><div class="card">${ms.map(m => barisMatch(m)).join('')}</div>`;
}

// ---------- Bagan ----------
function bagan() {
  const sf = D.match.filter(m => m.fase === 'Semifinal');
  const fn = D.match.find(m => m.fase === 'Final');
  if (!sf.length) return `<p class="mut">Bagan muncul otomatis setelah semua pertandingan grup selesai.</p>`;
  const kartu = m => {
    const s = m.status === 'Selesai';
    const mh = s && +m.skorHome > +m.skorAway, ma = s && +m.skorAway > +m.skorHome;
    return `<div class="card">
      <div class="row ${mh?'menang':''}">${tim(m.home)}<span>${s?m.skorHome:'-'}</span></div>
      <div class="row ${ma?'menang':''}">${tim(m.away)}<span>${s?m.skorAway:'-'}</span></div></div>`;
  };
  const juara = fn && fn.status === 'Selesai' ? K(+fn.skorHome > +fn.skorAway ? fn.home : fn.away) : null;
  return `<div class="bagan">
    <div><div class="mut" style="margin-bottom:8px">SEMIFINAL</div>${sf.map(kartu).join('')}</div>
    <div><div class="mut" style="margin-bottom:8px">FINAL</div>${fn ? kartu(fn) : '<div class="card mut">Menunggu pemenang semifinal</div>'}
    ${juara ? `<div class="card" style="text-align:center">&#127942; Juara<br><br>${logo(juara)}<h3>${esc(juara.nama)}</h3></div>` : ''}</div>
  </div>`;
}

// ---------- Top skor ----------
function topskor() {
  const t = D.topSkor || [];
  if (!t.length) return `<p class="mut">Belum ada gol tercatat. Input gol lewat tab Kelola.</p>`;
  return `<div class="card"><table><tr><th>#</th><th>Pemain</th><th>Klub</th><th>Gol</th></tr>` +
    t.map((p,i) => `<tr><td>${i+1}</td><td>${ava(p)}${esc(p.nama)}</td><td><div class="tim" style="justify-content:center">${logo(K(p.klubId),1)}${esc(K(p.klubId).nama)}</div></td><td class="pts">${p.gol}</td></tr>`).join('') +
    `</table></div>`;
}

// ---------- Panggilan ke server ----------
const ok = d => { edK = null; edP = null; load(d); toast('Tersimpan'); };
let _sib = 0;
function bar(on) {
  const b = document.getElementById('bar');
  if (on) { if (!_sib++) { b.className = ''; void b.offsetWidth; b.className = 'on'; } }
  else if (--_sib <= 0) { _sib = 0; b.className = 'fin'; setTimeout(() => { if (!_sib) b.className = ''; }, 300); }
}
function panggil(fn, args, sukses) {
  const tombol = document.activeElement && document.activeElement.tagName === 'BUTTON' ? document.activeElement : null;
  if (tombol) { tombol.classList.add('is-loading'); tombol.setAttribute('aria-busy', 'true'); tombol.disabled = true; }
  const pulihkanTombol = () => { if (tombol) { tombol.classList.remove('is-loading'); tombol.removeAttribute('aria-busy'); tombol.disabled = false; } };
  bar(1);
  const t = setTimeout(() => toast('Peringatan: Server tidak merespons. Coba jendela Incognito (satu akun Google) atau izinkan cookie pihak ketiga.'), 15000);
  google.script.run
    .withSuccessHandler(r => { clearTimeout(t); bar(0); pulihkanTombol(); sukses(r); })
    .withFailureHandler(e => { clearTimeout(t); bar(0); pulihkanTombol(); gagal(e); })[fn](...args);
}
const v = id => document.getElementById(id).value;
function hapusBtn(fn, id) { return `<button class="btn sm" onclick="${fn}('${id}')">${konfirm === id ? 'Yakin?' : 'Hapus'}</button>`; }

// ---------- Admin / Kelola ----------
function kelola() {
  let h = `<div class="card login-panel">
    <div class="login-heading"><span class="login-icon">&#128274;</span><div><b>Akses Pengelola</b><div class="mut">Login admin atau perwakilan klub</div></div></div>
    <input type="password" placeholder="Password admin / kode klub" value="${esc(PW)}" oninput="PW=this.value">
    <button class="btn" onclick="masuk()">Masuk</button>
    ${ROLE ? `<button class="btn sm" onclick="keluar()">Keluar</button> <span class="mut">Login: ${ROLE === 'admin' ? 'Admin' : esc(K(RK).nama)}</span>` : ''}
    <span id="msg"></span>
    <p class="mut" style="margin-bottom:0">Admin: kelola semua. Perwakilan klub: masuk dengan kode klub untuk mengedit identitas &amp; pemain klubnya sendiri.</p></div>`;
  if (!ROLE) return h;

function peringatanBentrok() {
  const b = D.bentrok || [];
  if (!b.length) return '';
  return '<div class="card" style="border-color:#e35d6a;margin-bottom:10px"><b>Bentrok jadwal:</b> ' + b.length

function adminSkor() {
  const mp = modePilih || D.mode;
  return `<h2>Jadwal &amp; skor</h2><div class="card">${peringatanBentrok()}
    <div style="margin-bottom:10px"><b>Mode kompetisi:</b>
      <select onchange="modePilih=this.value;konfirm=null;render()">
        <option value="grup" ${mp === 'grup' ? 'selected' : ''}>Group stage (grup + semifinal + final)</option>
        <option value="liga" ${mp === 'liga' ? 'selected' : ''}>Liga (1 klasemen, kandang-tandang)</option>
      </select>
      ${mp !== D.mode ? `<button class="btn sm" onclick="terapkanMode()">${konfirm === 'mode' ? 'Yakin? Jadwal & skor direset' : 'Terapkan mode'}</button>` : '<span class="mut">(aktif)</span>'}
    </div>
    <input type="date" value="${esc(MULAI)}" oninput="MULAI=this.value" title="Tanggal mulai (kosong = Sabtu depan)">
    <button class="btn" onclick="buatJadwal()">Buat jadwal otomatis (reset skor)</button>
    <button class="btn sm" onclick="rapikan()">Rapikan tanggal (skor tetap)</button>
    <button class="btn sm" onclick="rapikanDb()">Rapikan tampilan database</button>
    <button class="btn sm" onclick="kosongkan()">Kosongkan jadwal</button>
    ${mp === 'grup' ? `<div style="margin-top:12px"><b>Tanggal mulai fase gugur:</b> <span class="mut">(kosong = otomatis)</span>${['Semifinal','Final'].map(f => `<div style="margin-top:6px">${f}: <input type="date" id="mf_${f}" value="${esc((D.mulaiGugur || {})[f] || '')}"> <button class="btn sm" onclick="simpanMulai('${f}')">Simpan</button> <button class="btn sm" onclick="otoMulai('${f}')">Otomatis</button></div>`).join('')}</div>` : ''}
    <p class="mut" style="margin-bottom:0">Tambah/hapus klub &rarr; buat jadwal ulang. Satu lapangan: maksimal 1 pertandingan per hari. Mode group stage: semifinal &amp; final otomatis, fase gugur tidak boleh seri.</p></div>` + jadwal(true);
}

function bagianKlub() {
  const admin = ROLE === 'admin';
  if (!admin) gKlub = RK;
  const daftar = admin ? D.klub : [K(RK)];
  let h = `<h2>Klub</h2><div class="card">` + (admin ? `<button class="btn sm" onclick="edK={};render()">+ Tambah klub</button>` : '') +
    `<table>${daftar.map(k => `<tr><td>${logo(k,1)}</td><td>${esc(k.nama)} <span class="mut">Grup ${esc(k.grup)}</span></td>
      <td><button class="btn sm" onclick="editKlub('${k.id}')">Edit</button>${admin ? ' ' + hapusBtn('hapusKlub', k.id) : ''}</td></tr>`).join('')}</table></div>`;
  if (edK) h += formKlub(admin);

  const ps = D.pemain.filter(p => p.klubId === gKlub).sort((a, b) => a.nomor - b.nomor);
  h += `<h2>Pemain</h2><div class="card">`;
  if (admin) h += `<select onchange="gKlub=this.value;edP=null;render()">${D.klub.map(k => `<option value="${k.id}" ${k.id === gKlub ? 'selected' : ''}>${esc(k.nama)}</option>`).join('')}</select> `;
  h += `<button class="btn sm" onclick="edP={klubId:gKlub};render()">+ Tambah pemain</button> <button class="btn sm" onclick="edMassal=!edMassal;render()">Tempel daftar</button>`;
  if (edMassal) h += `<div style="margin:10px 0"><p class="mut" style="margin:0 0 6px">Satu pemain per baris: <b>nomor, nama, posisi</b> (GK, DF, MF, FW, atau kiper, bek, gelandang, penyerang).</p>
    <textarea id="massal" rows="9" style="width:100%;padding:8px;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;font:inherit" placeholder="1, Budi Santoso, GK&#10;2, Ahmad Fauzi, DF&#10;10, Rudi Hermawan, MF&#10;9, Joko Pratama, FW"></textarea>
    <button class="btn" style="margin-top:8px" onclick="simpanMassal()">Simpan semua</button> <button class="btn sm" onclick="edMassal=false;render()">Batal</button></div>`;
  h += `
    <table><tr><th>No</th><th>Nama</th><th>Pos</th><th>Gol</th><th></th></tr>` +
    ps.map(p => `<tr><td>${esc(p.nomor)}</td><td>${ava(p)}${esc(p.nama)}</td><td>${esc(p.posisi)}</td>
      <td>${admin ? `<input type="number" min="0" id="g_${p.id}" value="${p.gol}"> <button class="btn sm" onclick="simpanGol('${p.id}')">Simpan</button>` : p.gol}</td>
      <td><button class="btn sm" onclick="editPemain('${p.id}')">Edit</button> ${hapusBtn('hapusPemain', p.id)}</td></tr>`).join('') + `</table></div>`;
  if (edP) h += formPemain();
  return h;
}

function formKlub(admin) {
  const k = edK;
  const f = (id, label, val, type) => `<label class="mut">${label}<br><input id="fk_${id}" type="${type || 'text'}" value="${esc(val)}"></label>`;
  return `<div class="card"><h3 style="margin-top:0">${k.id ? 'Edit' : 'Tambah'} klub</h3><div class="form">
    ${f('nama','Nama klub',k.nama)} ${f('kota','Kota',k.kota)} ${f('berdiri','Tahun berdiri',k.berdiri,'number')}
    ${f('stadion','Stadion',k.stadion)} <div><div class="mut">Logo (pilih gambar)</div>
      <input type="file" accept=".png,.jpg,.jpeg,.webp,.gif" onchange="pilihLogo(this)">
      <div style="margin-top:6px;display:flex;align-items:center;gap:10px"><span id="prevLogo">${logo({logo:k.logo, nama:k.nama||'?', warna:k.warna||'#2563eb'})}</span>
      <button class="btn sm" onclick="hapusLogo()">Hapus logo</button></div></div>
    ${f('warna','Warna',k.warna || '#2563eb','color')}
    ${admin ? f('grup','Grup (A/B)',k.grup) + f('kode','Kode klub (kosong = tidak diubah)','') : ''}
  </div><button class="btn" onclick="simpanKlub()">Simpan</button> <button class="btn sm" onclick="edK=null;render()">Batal</button></div>`;
}

function formPemain() {
  const p = edP;
  const pos = ['GK','DF','MF','FW'].map(x => '<option' + (x === p.posisi ? ' selected' : '') + '>' + x + '</option>').join('');
  const fotoHtml = p.foto ? '<img class="ava" style="width:56px;height:56px" src="' + esc(p.foto) + '" alt="">' : '<span class="mut">Belum ada foto</span>';
  return '<div class="card"><h3 style="margin-top:0">' + (p.id ? 'Edit' : 'Tambah') + ' pemain</h3><div class="form">'
    + '<label class="mut">Nama<br><input id="fp_nama" value="' + esc(p.nama) + '"></label>'
    + '<label class="mut">Nomor<br><input id="fp_nomor" type="number" min="1" value="' + esc(p.nomor) + '"></label>'
    + '<label class="mut">Posisi<br><select id="fp_posisi">' + pos + '</select></label>'
    + '<div><div class="mut">Foto pemain</div>'
    + '<input type="file" accept=".png,.jpg,.jpeg,.webp,.gif" onchange="pilihFoto(this)">'
    + '<div style="margin-top:6px;display:flex;align-items:center;gap:10px"><span id="prevFoto">' + fotoHtml + '</span>'
    + '<button class="btn sm" onclick="hapusFoto()">Hapus foto</button></div></div>'
    + '</div><button class="btn" onclick="simpanPemain()">Simpan</button> '
    + '<button class="btn sm" onclick="edP=null;render()">Batal</button></div>';
}

function masuk() {
  if (!PW.trim()) { toast('Masukkan password admin atau kode klub terlebih dahulu.'); return; }
  toast('Memverifikasi akses...');
  panggil('cekLogin', [PW], r => {
    ROLE = r.role; RK = r.klubId || null;
    if (ROLE === 'klub') gKlub = RK;
    render();
    toast(ROLE === 'admin' ? 'Selamat datang, Admin!' : 'Login perwakilan klub berhasil.');
    if (ROLE === 'admin') muatDaftar();
  });
}
function keluar() { ROLE = null; RK = null; PW = ''; edK = null; edP = null; render(); }
function editKlub(id) { edK = Object.assign({}, K(id)); render(); }
function editPemain(id) { edP = Object.assign({}, D.pemain.find(p => p.id === id)); render(); }

function prevLogo() { document.getElementById('prevLogo').innerHTML = logo({ logo: edK.logo, nama: v('fk_nama') || '?', warna: v('fk_warna') }); }
function pilihLogo(inp) {
  const f = inp.files[0];
  if (!f) return;
  if (!f.type.startsWith('image/')) return gagal(new Error('File harus berupa gambar'));
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const S = 160, c = document.createElement('canvas');
      c.width = c.height = S;
      const m = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
      let d = c.toDataURL('image/webp', 0.85);
      if (d.indexOf('data:image/webp') !== 0) d = c.toDataURL('image/png');
      if (d.length > 45000) d = c.toDataURL('image/jpeg', 0.7);
      if (d.length > 45000) return gagal(new Error('Gambar terlalu besar'));
      edK.logo = d;
      prevLogo();
    };
    img.onerror = () => gagal(new Error('Gambar tidak bisa dibaca'));
    img.src = r.result;
  };
  r.readAsDataURL(f);
}

function simpanKlub() {
  const d = { id: edK.id || '', nama: v('fk_nama'), kota: v('fk_kota'), berdiri: v('fk_berdiri'), stadion: v('fk_stadion'), logo: edK.logo || '', warna: v('fk_warna') };
  if (ROLE === 'admin') { d.grup = v('fk_grup'); d.kode = v('fk_kode'); }
  panggil('simpanKlub', [d, PW], ok);
}
function prevFoto() {
  document.getElementById('prevFoto').innerHTML = edP.foto ? `<img class="ava" style="width:56px;height:56px" src="${esc(edP.foto)}" alt="">` : '<span class="mut">Belum ada foto</span>';
}
function hapusLogo() { edK.logo = ''; prevLogo(); }
function hapusFoto() { edP.foto = ''; prevFoto(); }
function pilihFoto(inp) {
  const f = inp.files[0];
  if (!f) return;
  if (!f.type.startsWith('image/')) return gagal(new Error('File harus berupa gambar'));
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const W = 150, H = 200, c = document.createElement('canvas');
      c.width = W; c.height = H;
      let sw = img.width, sh = img.height;
      if (sw / sh > W / H) sw = sh * W / H; else sh = sw * H / W;
      c.getContext('2d').drawImage(img, (img.width - sw) / 2, (img.height - sh) * 0.15, sw, sh, 0, 0, W, H);
      let d = c.toDataURL('image/webp', 0.8);
      if (d.indexOf('data:image/webp') !== 0) d = c.toDataURL('image/jpeg', 0.75);
      if (d.length > 45000) d = c.toDataURL('image/jpeg', 0.5);
      if (d.length > 45000) return gagal(new Error('Foto terlalu besar'));
      edP.foto = d;
      prevFoto();
    };
    img.onerror = () => gagal(new Error('Gambar tidak bisa dibaca'));
    img.src = r.result;
  };
  r.readAsDataURL(f);
}
function simpanPemain() {
  panggil('simpanPemain', [{ id: edP.id || '', klubId: edP.klubId || gKlub, nama: v('fp_nama'), nomor: v('fp_nomor'), posisi: v('fp_posisi'), foto: edP.foto || '' }, PW], ok);
}
function hapusKlub(id) { if (konfirm !== id) { konfirm = id; return render(); } konfirm = null; panggil('hapusKlub', [id, PW], ok); }
function hapusPemain(id) { if (konfirm !== id) { konfirm = id; return render(); } konfirm = null; panggil('hapusPemain', [id, PW], ok); }
function simpanGol(id) { panggil('setGol', [id, v('g_' + id), PW], ok); }
function simpanTgl(id) { panggil('aturTanggal', [id, v('t_' + id), v('j_' + id), PW], ok); }
function simpanMulai(f) { panggil('setMulaiFase', [f, v('mf_' + f), PW], ok); }
function otoMulai(f) { panggil('setMulaiFase', [f, '', PW], ok); }
function muatDaftar() { panggil('daftarList', [PW], r => { DAFTAR = r; render(); }); }
function kartuDaftar() {
  if (!DAFTAR.length) return `<h2>Pendaftaran klub baru</h2><div class="card mut">Belum ada pendaftaran baru. Halaman pendaftaran: tambahkan ?page=Daftar di alamat web.</div>`;
  return `<h2>Pendaftaran klub baru (${DAFTAR.length})</h2><div class="card"><table><tr><th>Klub</th><th>Kota</th><th>Perwakilan</th><th>WhatsApp</th><th>Grup</th><th></th></tr>` +
    DAFTAR.map(x => `<tr><td>${esc(x.nama)}</td><td>${esc(x.kota)}</td><td>${esc(x.kontak)}</td><td>${esc(String(x.wa).replace(/^'/, ''))}</td>
      <td><select id="dg_${x.id}"><option>A</option><option>B</option></select></td>
      <td><button class="btn sm" onclick="terima('${x.id}')">Terima</button> <button class="btn sm" onclick="tolak('${x.id}')">${konfirm === x.id ? 'Yakin?' : 'Tolak'}</button></td></tr>`).join('') +
    `</table><p class="mut" style="margin-bottom:0">Setelah klub diterima, buat jadwal ulang. Kode klub ditampilkan sekali saat diterima.</p></div>`;
}
function terima(id) { panggil('terimaDaftar', [id, v('dg_' + id), PW], r => { load(r.data); toast('Klub diterima. Kode klub: ' + r.kode); muatDaftar(); }); }
function tolak(id) { if (konfirm !== id) { konfirm = id; return render(); } konfirm = null; panggil('tolakDaftar', [id, PW], () => { toast('Pendaftaran ditolak'); muatDaftar(); }); }
function simpanMassal() {
  panggil('simpanPemainMassal', [gKlub, v('massal'), PW], r => {
    edMassal = false; load(r.data);
    const l = r.lewati || [];
    toast(r.tambah + ' pemain ditambah' + (l.length ? ', ' + l.length + ' dilewati: ' + l.slice(0, 3).join('; ') + (l.length > 3 ? '; ...' : '') : ''));
  });
}
function rapikanDb() { toast('Merapikan database, mohon tunggu sekitar 20 detik...'); panggil('rapikanDatabase', [PW], () => toast('Database sudah dirapikan. Buka Google Sheet untuk melihat.')); }
function rapikan() { panggil('rapikanJadwal', [PW], ok); }
function kosongkan() { panggil('kosongkanJadwal', [PW], ok); }
function terapkanMode() {
  if (konfirm !== 'mode') { konfirm = 'mode'; return render(); }
  konfirm = null;
  const m = modePilih; modePilih = null;
  panggil('setMode', [m, PW], ok);
}
function buatJadwal() { document.getElementById('msg').textContent = 'Memproses...'; panggil('generateJadwal', [MULAI, PW], ok); }
function simpan(id) {
  const h = document.getElementById('h_'+id).value, a = document.getElementById('a_'+id).value;
  if (h === '' || a === '') return gagal(new Error('Isi kedua skor'));
  panggil('simpanSkor', [id, h, a, PW], ok);
}

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height), x = document.createElement('span');
  x.className = 'rip';
  x.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
  b.appendChild(x);
  setTimeout(() => x.remove(), 600);
});

// ===== Pencetak gol per pertandingan & bagikan WhatsApp =====
let edGol = null;
const GM = () => (D && D.golMatch) || [];
const adaP = id => D.pemain.find(p => p.id === id);

// 1) baris pertandingan: tampilkan pencetak gol + tombol isi (admin)
const _bm = barisMatch;
barisMatch = function (m, edit) {
  const h = _bm(m, edit);
  const g = GM().filter(x => x.matchId === m.id && adaP(x.pemainId));
  const nama = g.map(x => esc(adaP(x.pemainId).nama) + (x.jumlah > 1 ? ' &times;' + x.jumlah : '')).join(', ');
  const btn = edit && m.status === 'Selesai' ? ` <button class="btn sm" onclick="bukaGol('${m.id}')">${g.length ? 'Ubah' : 'Isi'} pencetak gol</button>` : '';
  return h + (nama || btn ? `<div class="mut" style="padding:2px 0 8px">${nama ? '&#9917; ' + nama : ''}${btn}</div>` : '');
};

// 2) form pencetak gol (muncul di atas "Jadwal & skor")
function bukaGol(id) { edGol = id; render(); const f = document.getElementById('formGol'); if (f) f.scrollIntoView({ behavior: 'smooth' }); }
function formGol() {
  const m = D.match.find(x => x.id === edGol);
  if (!m) return '';
  const lama = {};
  GM().filter(x => x.matchId === m.id).forEach(x => { lama[x.pemainId] = x.jumlah; });
  const kol = (kid, skor) => `<div><b>${esc(K(kid).nama)}</b> <span class="mut">(skor ${skor})</span>` +
    D.pemain.filter(p => p.klubId === kid).sort((a, b) => a.nomor - b.nomor).map(p =>
      `<div style="display:flex;justify-content:space-between;align-items:center;padding:3px 0"><span>${esc(p.nomor)}. ${esc(p.nama)}</span><input type="number" min="0" class="gi" data-p="${p.id}" value="${lama[p.id] || 0}" style="width:60px;text-align:center"></div>`).join('') + '</div>';
  return `<div class="card" id="formGol" style="margin-bottom:10px"><h3 style="margin-top:0">Pencetak gol: ${esc(K(m.home).nama)} ${m.skorHome} - ${m.skorAway} ${esc(K(m.away).nama)}</h3>
    <div class="form" style="grid-template-columns:1fr 1fr">${kol(m.home, m.skorHome)}${kol(m.away, m.skorAway)}</div>
    <button class="btn" onclick="kirimGol()">Simpan</button> <button class="btn sm" onclick="edGol=null;render()">Batal</button>
    <p class="mut" style="margin-bottom:0">Isi jumlah gol tiap pemain. Total gol tiap klub tidak boleh melebihi skornya.</p></div>`;
}
function kirimGol() {
  const d = [];
  document.querySelectorAll('.gi').forEach(i => { const n = parseInt(i.value, 10) || 0; if (n > 0) d.push({ pemainId: i.dataset.p, jumlah: n }); });
  panggil('simpanGolMatch', [edGol, d, PW], r => { edGol = null; ok(r); });
}
const _as = adminSkor;
adminSkor = function () { return (edGol ? formGol() : '') + _as(); };

// 3) bagikan ke WhatsApp
function bagikan(t) { window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank'); }
const tmbBagi = fn => `<button class="btn sm" style="margin-top:12px" onclick="bagikan(${fn}())">&#128228; Bagikan ke WhatsApp</button>`;
const jamM = m => String(m.tanggal).slice(11, 16) || '15:00';
const PENUTUP = '\n\n_Liga Desa Tenjoayu - Satu Lapangan, Satu Semangat, Menuju Juara!_';

function teksJadwal() {
  const ms = urut(D.match.filter(m => m.status !== 'Selesai')).slice(0, 7);
  if (!ms.length) return 'Belum ada jadwal pertandingan.';
  return '*JADWAL LIGA DESA TENJOAYU*\n\n' + ms.map(m => '\u{1F4C5} ' + tglID(m.tanggal, 1) + ', ' + jamM(m) + ' WIB\n\u26BD ' + K(m.home).nama + ' vs ' + K(m.away).nama).join('\n\n') + PENUTUP;
}
function teksHasil() {
  const ms = urut(D.match.filter(m => m.status === 'Selesai')).reverse().slice(0, 5);
  return '*HASIL PERTANDINGAN*\n\n' + ms.map(m => {
    const g = GM().filter(x => x.matchId === m.id && adaP(x.pemainId)).map(x => adaP(x.pemainId).nama + (x.jumlah > 1 ? ' (' + x.jumlah + ')' : '')).join(', ');
    return '\u26BD ' + K(m.home).nama + ' *' + m.skorHome + ' - ' + m.skorAway + '* ' + K(m.away).nama + (g ? '\nGol: ' + g : '');
  }).join('\n\n') + PENUTUP;
}
function teksKlasemen() {
  const liga = D.mode === 'liga';
  return '*KLASEMEN LIGA DESA TENJOAYU*\n\n' + Object.keys(D.klasemen).sort().map(g =>
    '\u{1F3C6} *' + (liga ? 'Klasemen' : 'Grup ' + g) + '*\n' + D.klasemen[g].map((r, i) => (i + 1) + '. ' + r.nama + ' - ' + r.pts + ' poin (M' + r.m + ', SG ' + (r.sg > 0 ? '+' : '') + r.sg + ')').join('\n')).join('\n\n') + PENUTUP;
}

const _jd = jadwal;
jadwal = function (edit) { const h = _jd(edit); return edit || !D.match.length ? h : tmbBagi('teksJadwal') + h; };
const _hs = hasil;
hasil = function () { const h = _hs(); return D.match.some(m => m.status === 'Selesai') ? tmbBagi('teksHasil') + h : h; };
const _kl = klasemen;
klasemen = function () { return tmbBagi('teksKlasemen') + _kl(); };

// ---------- Pemuatan awal ----------
function muatPenuh() {
  google.script.run
    .withSuccessHandler(function (d) {
      D = d; window.D = d;
      const el = document.activeElement;
      const sibuk = edK || edP || (el && /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName));
      if (!sibuk) render();
    })
    .withFailureHandler(function () { return 0; })
    .getData();
}
function muatAwal() {
  panggil('getData', [true], function (d) { load(d); muatPenuh(); });
  google.script.run.withSuccessHandler(u => {
  APPURL = u || '';
  gambarNav();
  const a = document.getElementById('lnkAdmin');
  if (a && APPURL && !ADMIN_PAGE) { a.href = APPURL + '?page=Admin'; a.hidden = false; }
}).withFailureHandler(() => 0).urlApp();
}
muatAwal();
</script>
